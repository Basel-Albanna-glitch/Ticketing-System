server {
    listen 80;
    server_name _;

    # KB attachments and avatars are uploaded through the API; nginx's 1 MB default
    # would reject anything bigger with a 413 before Django ever sees the request.
    client_max_body_size 25M;

    # The SPA calls the API at a relative /api path (see frontend/src/api/client.js),
    # so everything is same-origin here and CORS never comes into play.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report exports can take a while to generate.
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files (admin CSS/JS) are collected into a shared volume
    # by the backend entrypoint.
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 30d;
    }

    # User uploads. Django cannot serve these with DEBUG=False (config/urls.py only
    # wires up static() under DEBUG), so nginx reads the shared media volume directly.
    location /media/ {
        alias /usr/share/nginx/media/;
        access_log off;
        expires 7d;
    }

    # Built SPA. Vite emits content-hashed filenames under /assets, so those are
    # immutable; index.html must never be cached or clients pin to a stale bundle.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
